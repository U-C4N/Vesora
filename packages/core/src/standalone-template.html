<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Vesora — Interactive figure</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#24323a;background:#f4f2ec;font-synthesis:none;color-scheme:light}
    *{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.5}[hidden]{display:none!important}
    button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #8397ee;outline-offset:3px}button,select{min-height:44px;border:1px solid #d6ddd8;border-radius:7px;background:#fff;color:#34444e;padding:10px 14px;font-size:13px}button:hover:not(:disabled){border-color:#9caeec;background:#f4f6ff}button:active:not(:disabled){background:#e8edff}
    .page{max-width:1440px;margin:auto;padding:28px 32px 24px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:24px;border-bottom:1px solid #dce1d8}.brand{display:flex;align-items:center;gap:14px;min-width:0}.wordmark{font-size:26px;font-weight:750;letter-spacing:-1.3px;color:#24323a}.wordmark span{color:#2b4fec}.eyebrow{font:10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.3px;text-transform:uppercase;color:#6b796f}.brand .eyebrow{padding-left:14px;border-left:1px solid #d6ddd8}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:#2b4fec;color:white;border-color:#2b4fec}.primary:hover:not(:disabled){background:#2343d1;color:#fff;border-color:#2343d1}
    .statusline{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;font-size:12px;color:#6b7972}.status{display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}.status::before{content:"";height:6px;width:6px;flex:none;border-radius:50%;background:#2b4fec}.statusline .local-label{font-size:11px;white-space:nowrap;color:#879088}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}.plot-panel{min-width:0;overflow:hidden;border:1px solid #dce1d8;border-radius:10px;background:#fff;box-shadow:0 3px 14px #28332e04}.chart{min-width:0;width:100%;min-height:180px;overflow:hidden}.chart canvas{display:block;max-width:100%}.interaction-help{margin:0;padding:16px 20px;border-top:1px solid #edf0eb;color:#718078;font-size:11px;line-height:1.7}.rail{display:grid;gap:18px;min-width:0}.panel{min-width:0;border:1px solid #dce1d8;border-radius:9px;background:#fafbf8;padding:20px}.panel h2{font-size:14px;line-height:1.4;margin:0 0 7px;font-weight:650}.panel-intro{font-size:12px;line-height:1.65;color:#78847c;margin:0 0 15px}.bookmark-list{display:grid;gap:7px}.bookmark{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;min-width:0;font-size:12px;line-height:1.5;padding:11px 12px}.bookmark-number{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;color:#8a958d;flex:none}.bookmark-label{min-width:0;overflow-wrap:anywhere}.bookmark[aria-pressed="true"]{color:#2846be;border-color:#aebcf0;background:#eef2ff}.bookmark[aria-pressed="true"] .bookmark-number{color:#526bc4}.bookmark-note{margin:16px 0 0;padding:0 0 0 12px;border-left:2px solid #b8c6f2;white-space:pre-wrap;overflow-wrap:anywhere;color:#647367;font-size:12px;line-height:1.75}
    .inspector>summary{font-size:14px;font-weight:650;cursor:pointer;line-height:1.4;min-height:24px}.inspector[open]>summary{margin-bottom:17px}.layer-field{display:grid;gap:7px;font-size:11px;color:#738076;margin-bottom:16px}.layer-field select{width:100%;min-width:0;font-size:12px;padding:10px}.representation-name{margin:0 0 8px;font-weight:650;font-size:14px;overflow-wrap:anywhere}.representation-note{font-size:11px;line-height:1.6;color:#6e7b71;margin:0 0 18px}.metrics{margin:0}.metric{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid #e3e8df;font-size:11px;line-height:1.5}.metric dt{color:#748073;min-width:0}.metric dd{margin:0;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums;color:#33473c;overflow-wrap:anywhere;text-align:right}.method{font-size:11px;color:#718078;margin-top:13px}.method summary{cursor:pointer;min-height:30px;display:flex;align-items:center}.method p{line-height:1.7;overflow-wrap:anywhere}.empty-inspector{font-size:12px;line-height:1.7;color:#718078;margin:0}.error{margin:0 0 20px;padding:17px 20px;border:1px solid #ebc8bc;border-radius:8px;background:#fff3ed;color:#873d2c;font-size:12px;line-height:1.7;overflow-wrap:anywhere}.error strong{display:block;margin-bottom:3px}.footer{display:flex;justify-content:space-between;gap:20px;padding:25px 0 0;font-size:10px;line-height:1.7;color:#8c958b}.footer p{margin:0}.noscript{margin-top:24px}
    @media(max-width:899px){.page{padding:20px 20px 24px}.layout{display:flex;flex-direction:column;gap:16px}.rail{display:contents}.bookmarks{order:0;width:100%}.plot-panel{order:1;width:100%}.inspector{order:2;width:100%}.bookmark-list{display:flex;flex-wrap:wrap}.bookmark{width:auto;flex:1 1 180px}.panel{padding:17px}.panel-intro{margin-bottom:12px}.statusline{min-height:56px}.brand .eyebrow{display:none}.footer{flex-direction:column;gap:5px}.interaction-help{padding:13px 16px}}
    @media(max-width:480px){.page{padding:17px 12px 20px}.topbar{align-items:flex-start;flex-direction:column;gap:16px;padding-bottom:18px}.actions{width:100%}.actions button{flex:1;min-width:0;padding:10px;font-size:12px}.statusline .local-label{display:none}.bookmark{flex-basis:100%}.bookmark-note{margin-top:13px}.wordmark{font-size:25px}.statusline{font-size:11px}.interaction-help{font-size:10px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="page" id="vesora-viewer" data-ready="loading">
    <header class="topbar">
      <div class="brand"><span class="wordmark">vesora<span>.</span></span><span class="eyebrow">Interactive figure</span></div>
      <div class="actions" aria-label="Figure actions"><button id="vesora-reset" type="button" disabled>Reset view</button><button id="vesora-png" class="primary" type="button" disabled>Download PNG</button></div>
    </header>
    <div class="statusline"><span class="status" id="vesora-status" role="status" aria-live="polite">Preparing figure…</span><span class="local-label">Self-contained · Works offline</span></div>
    <div class="error" id="vesora-error" role="alert" hidden><strong>Unable to display this figure</strong><span id="vesora-error-message"></span></div>
    <main class="layout">
      <section class="plot-panel" aria-label="Interactive scientific figure"><div class="chart" id="vesora-chart" aria-busy="true"></div><p class="interaction-help" id="vesora-help"></p></section>
      <aside class="rail" aria-label="Explore this figure">
        <section class="panel bookmarks" id="vesora-bookmark-panel" aria-labelledby="vesora-bookmark-heading" hidden><h2 id="vesora-bookmark-heading">Bookmarks</h2><p class="panel-intro">Follow a saved view, then explore on your own.</p><div class="bookmark-list" id="vesora-bookmarks"></div><p class="bookmark-note" id="vesora-bookmark-note" hidden></p></section>
        <details class="panel inspector" id="vesora-inspector"><summary>Inspector</summary><label class="layer-field" id="vesora-layer-field" hidden>Layer<select id="vesora-layer" aria-label="Layer"></select></label><p class="empty-inspector" id="vesora-inspector-empty">Preparing view…</p><div id="vesora-inspector-content" hidden><p class="representation-name" id="vesora-representation"></p><p class="representation-note" id="vesora-representation-note"></p><dl class="metrics" id="vesora-metrics"></dl><details class="method"><summary>Details</summary><p id="vesora-method"></p></details></div></details>
      </aside>
    </main>
    <footer class="footer"><p>Explore the data. Keep the context.</p><p>Created with Vesora · All data is included in this file.</p></footer>
    <noscript><p class="error noscript">JavaScript is required to open this interactive figure. Enable JavaScript and reopen the file. No internet connection is needed.</p></noscript>
  </div>
  <script id="vesora-payload" type="application/json">__VESORA_PAYLOAD_JSON__</script>
  <script type="module">__VESORA_RUNTIME_SOURCE__</script>
</body>
</html>
