<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Vesora 1.0 — ten lenses, one engine</title>
  <desc id="desc">Scientific visualization for Python, JavaScript and React. Ten analysis families with source-aware inspection and portable observations. Version 1.0.0 local source build, MIT licensed.</desc>
