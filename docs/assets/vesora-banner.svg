<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Vesora — shared scientific observations</title>
  <desc id="desc">Shared Python, JavaScript and React scientific visualization with source semantics and observation records. Version 0.9.0-rc.7 release candidate, MIT licensed.</desc>
  <rect width="1200" height="240" rx="20" fill="#1b221b"/>
  <path d="M48 32h1104M48 203h1104" stroke="#3b4632"/>
  <g transform="translate(46 61) scale(2.3)" fill="#d5fa65">
    <path d="M4 9.5h9.1l10.5 20.8-5.4 5.2L4 9.5Z"/>
    <path d="m14.5 4.5 7.6 2.4 5.6 12.7-4.1 10.7L14.5 4.5Z" opacity=".62"/>
    <path d="M26.4 7.8 36 4.5 23.6 30.3l-5.4 5.2 8.2-27.7Z"/>
  </g>
  <text x="164" y="139" fill="#f4f3ec" font-family="Manrope,Segoe UI,Arial,sans-serif" font-size="82" font-weight="600" letter-spacing="-5">vesora</text>
  <text x="169" y="170" fill="#aab69b" font-family="Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="1">YOUR DATA. YOUR PERSPECTIVE.</text>
  <text x="675" y="82" fill="#d5fa65" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="3">PRISM / OBSERVATION RECORDS</text>
  <text x="674" y="126" fill="#f4f3ec" font-family="Manrope,Segoe UI,Arial,sans-serif" font-size="33" font-weight="500" letter-spacing="-1">One engine. Shared observations.</text>
  <text x="675" y="158" fill="#aab69b" font-family="Segoe UI,Arial,sans-serif" font-size="16">Units, sources and rendered views, together.</text>
  <text x="49" y="224" fill="#aab69b" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">PYTHON / JAVASCRIPT / REACT / INTERACTIVE HTML</text>
  <text x="1037" y="224" fill="#d5fa65" font-family="Segoe UI,Arial,sans-serif" font-size="11">v0.9.0-rc.7 · MIT</text>
