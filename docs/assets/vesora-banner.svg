  <text x="674" y="126" fill="#f4f3ec" font-family="Manrope,Segoe UI,Arial,sans-serif" font-size="33" font-weight="500" letter-spacing="-1">Ten lenses. One engine.</text>
  <text x="675" y="158" fill="#aab69b" font-family="Segoe UI,Arial,sans-serif" font-size="16">Signals, trade-offs, uncertainty and composition.</text>
  <text x="49" y="224" fill="#aab69b" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">PYTHON / JAVASCRIPT / REACT / INTERACTIVE HTML</text>
  <text x="1050" y="224" fill="#d5fa65" font-family="Segoe UI,Arial,sans-serif" font-size="11">v1.0.0 · MIT</text>
