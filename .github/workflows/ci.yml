name: Validate shared engine
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --cache artifacts/npm-cache
      - run: npm run check
      - run: python -m pip install -e ".[test,notebook]"
      - run: python -c "import importlib.util; assert importlib.util.find_spec('numpy') is None"
      - run: npm run test:parity
      - run: npm run test:examples
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:saas
      - run: python -m pytest tests/python
      - run: python -m pip install -e ".[numpy]"
      - run: python -m pytest tests/python/test_numpy.py
      - run: python -m pip install "setuptools>=77" wheel
      - run: npm run package:release -- --candidate
      - id: release-path
        run: node --input-type=module -e "import fs from 'node:fs'; const version=JSON.parse(fs.readFileSync('package.json','utf8')).version; fs.appendFileSync(process.env.GITHUB_OUTPUT,'directory=dist/release-v'+version+'\n');"
      - run: node scripts/verify-packages.mjs
      - run: node scripts/verify-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: ${{ steps.release-path.outputs.directory }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: |
            artifacts/release
            artifacts/consumers
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            test-results
            playwright-report
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -e ".[test,notebook]" "jupyterlab>=4,<5" ipykernel
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/jupyter.spec.mjs
        env:
          VESORA_TEST_JUPYTER: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: notebook-failures
          path: test-results
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -e ".[test,notebook]"
      - run: python -m pytest tests/python/test_desktop.py tests/python/test_linked_desktop.py tests/python/test_presentation.py tests/python/test_quality_desktop.py tests/python/test_streaming_desktop.py tests/python/test_v09_desktop.py --junitxml=artifacts/desktop.xml
        env:
          VESORA_TEST_QT: '1'
          QTWEBENGINE_CHROMIUM_FLAGS: '--use-angle=swiftshader --enable-unsafe-swiftshader'
      - run: python -c "import xml.etree.ElementTree as E; r=E.parse('artifacts/desktop.xml'); assert not any(int(s.get('skipped',0)) for s in r.iter('testsuite')), 'Desktop integration tests must execute without skips'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence
          path: artifacts/desktop.xml
  python-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -e ".[test,notebook]"
      - run: python -c "import importlib.util; assert importlib.util.find_spec('numpy') is None"
      - run: python -m pytest tests/python --ignore=tests/python/test_desktop.py --ignore=tests/python/test_linked_desktop.py --ignore=tests/python/test_quality_desktop.py --ignore=tests/python/test_streaming_desktop.py --ignore=tests/python/test_v09_desktop.py --ignore=tests/python/test_numpy.py --junitxml=artifacts/python-contracts.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-contracts-${{ matrix.python }}
          path: artifacts/python-contracts.xml
  react-consumers:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['18.3.1', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist/installed-release
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-react-consumers.mjs dist/installed-release
        env:
          VESORA_REACT_VERSION: ${{ matrix.react }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-consumers-${{ matrix.react }}
          path: artifacts/consumers
  browser-compatibility:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install firefox webkit
      - run: npx playwright test --config playwright.compat.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-compatibility-failures
          path: test-results
  installed-python-hosts:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist/installed-release
      - name: Install the wheel and its real host dependencies outside the checkout
        shell: pwsh
        run: |
          $hostEnvironment = Join-Path $env:RUNNER_TEMP 'vesora-installed-hosts'
          python -m venv $hostEnvironment
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create the installed-host environment' }
          $hostPython = Join-Path $hostEnvironment 'Scripts/python.exe'
          $wheels = @(Get-ChildItem -LiteralPath dist/installed-release -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected exactly one release wheel' }
          & $hostPython -m pip install "$($wheels[0].FullName)[test,notebook]" 'jupyterlab>=4,<5' ipykernel
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install release wheel and host dependencies' }
          & $hostPython -I -c "import vesora; assert 'site-packages' in vesora.__file__, vesora.__file__"
          if ($LASTEXITCODE -ne 0) { throw 'Imported package is not installed in site-packages' }
          "VESORA_PYTHON=$hostPython" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PYTHON=$hostPython" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Real Qt export and streaming from the installed wheel
        shell: pwsh
        run: '& $env:VESORA_PYTHON -m pytest -o pythonpath= tests/python/test_quality_desktop.py tests/python/test_streaming_desktop.py tests/python/test_v09_desktop.py --junitxml=artifacts/installed-qt.xml'
        env:
          VESORA_TEST_QT: '1'
          QTWEBENGINE_CHROMIUM_FLAGS: '--use-angle=swiftshader --enable-unsafe-swiftshader'
      - run: python -c "import xml.etree.ElementTree as E; r=E.parse('artifacts/installed-qt.xml'); assert not any(int(s.get('skipped',0)) for s in r.iter('testsuite')), 'Installed Qt integration tests must execute without skips'"
      - run: npx playwright install chromium
      - run: npx playwright test tests/browser/jupyter.spec.mjs
        env:
          VESORA_TEST_JUPYTER: '1'
          VESORA_INSTALLED_PACKAGE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-python-host-evidence
          path: |
            artifacts/installed-qt.xml
            test-results
