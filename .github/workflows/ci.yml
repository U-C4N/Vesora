name: Validate shared engine
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - run: python -m pip install -e ".[test,notebook]"
      - run: python -c "import importlib.util; assert importlib.util.find_spec('numpy') is None"
      - run: npm run test:parity
      - run: npm run test:examples
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python -m pytest tests/python
      - run: python -m pip install -e ".[numpy]"
      - run: python -m pytest tests/python/test_numpy.py
      - run: python -m pip install "setuptools>=77" wheel
      - run: npm run package:release
      - run: npm run test:packages
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            test-results
            playwright-report
